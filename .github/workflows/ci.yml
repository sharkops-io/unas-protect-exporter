# The whole pipeline lives in sharkops-io/.github exporter.yml; every exporter
# repo carries this exact file.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: sharkops-io/.github/.github/workflows/exporter.yml@main
    permissions:
      contents: read
      packages: write
