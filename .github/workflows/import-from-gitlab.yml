# One-off: copies the release tags already on registry.gitlab.com to GHCR with
# the same digests. Delete once the GitLab registry is retired.
name: import-from-gitlab

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  import:
    uses: sharkops-io/.github/.github/workflows/import-from-gitlab.yml@main
    with:
      source: registry.gitlab.com/sharkops/exporters/unas-protect-exporter
    permissions:
      contents: read
      packages: write
