include:
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'docker/build.yml'
  # lint + test. Extracted 2026-08-24 - this repo and four sibling exporters
  # carried byte-identical copies, which had already drifted (exporter-common
  # hardcoded golang:1.26 while the rest used ${GO_VERSION}).
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'go/ci.yml'
  # promtool validation of examples/rules.yaml. The entrypoint override and the
  # `exists:` guard both live in the template now.
  - project: 'sharkops/gitlab-ci-common-config'
    ref: master
    file: 'prometheus/rules.yml'

# The included template's jobs (build, build_release) both declare
# `stage: build`. It supplies no `stages:` list of its own, so this project
# must declare one that includes every stage any included or local job uses.
stages: [test, rules, build]

variables:
  # docker/build.yml (sharkops/gitlab-ci-common-config) builds with Kaniko —
  # no Docker-in-Docker. It is single-arch: whatever platform the Kaniko
  # executor itself runs on (amd64 on this org's shared runners). The
  # multi-arch (linux/amd64,linux/arm64) buildx image this project's plan
  # originally called for is therefore NOT produced here. That is an accepted
  # trade for this deployment: the target cluster is amd64-only.
  REGISTRY_URL: $CI_REGISTRY
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  IMAGE_NAME: $CI_REGISTRY_IMAGE
