groups:
  - name: unas-disks
    rules:
      - alert: UNASDiskNotOptimal
        expr: unas_disk_state{state!="optimal"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} is not optimal"
          description: 'Disk {{ $labels.serial }} in slot {{ $labels.slot }} reports state "{{ $labels.state }}" (expected "optimal").'

      - alert: UNASDiskHealthDegraded
        expr: unas_disk_health_score < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} health degraded"
          description: "Disk {{ $labels.serial }} in slot {{ $labels.slot }} reports health {{ $value }}/5."

      # increase() over 24h, so these fire on NEW sectors only. A disk carrying a
      # pre-existing uncorrectable sector must not alert forever.
      - alert: UNASDiskUncorrectableSectors
        expr: increase(unas_disk_uncorrectable_sector_count_total[24h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} gained an uncorrectable sector"
          description: "Disk {{ $labels.serial }} in slot {{ $labels.slot }} reported new uncorrectable sectors in the last 24h."

      - alert: UNASDiskBadSectors
        expr: increase(unas_disk_bad_sector_count_total[24h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} gained a bad sector"
          description: "Disk {{ $labels.serial }} in slot {{ $labels.slot }} reported new bad sectors in the last 24h."

      # Same increase()-over-24h shape and reasoning as the two sector
      # counters above: a new SMART read error in the last 24h is
      # actionable, a pre-existing count is not.
      - alert: UNASDiskReadErrors
        expr: increase(unas_disk_smart_read_error_count_total[24h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} reported a new SMART read error"
          description: "Disk {{ $labels.serial }} in slot {{ $labels.slot }} reported new SMART read errors in the last 24h."

      - alert: UNASDiskOverheating
        expr: unas_disk_temperature_celsius > 55
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "UNAS disk in slot {{ $labels.slot }} running hot"
          description: "Disk {{ $labels.serial }} in slot {{ $labels.slot }} has been above 55 °C for 30m."

  - name: unas-pools
    rules:
      - alert: UNASPoolUnhealthy
        expr: unas_pool_status{status!~"optimal|healthy|ok|fullyOperational|active|normal|scrubbing"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "UNAS pool {{ $labels.pool }} is not healthy"
          description: 'Pool {{ $labels.pool }} reports status "{{ $labels.status }}", which is not a known-good state.'

      - alert: UNASPoolProtectionDegraded
        expr: unas_pool_current_protection < unas_pool_expected_protection
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "UNAS pool {{ $labels.pool }} has lost redundancy"
          description: "RAID group {{ $labels.raid_group }} can absorb {{ $value }} more disk failure(s), fewer than configured."

      - alert: UNASPoolFillingUp
        expr: unas_pool_used_bytes / unas_pool_capacity_bytes > 0.85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "UNAS pool {{ $labels.pool }} is filling up"
          description: "Pool {{ $labels.pool }} is {{ $value | humanizePercentage }} full, above the 85% warning threshold."

      - alert: UNASPoolAlmostFull
        expr: unas_pool_used_bytes / unas_pool_capacity_bytes > 0.95
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "UNAS pool {{ $labels.pool }} is almost full"
          description: "Pool {{ $labels.pool }} is {{ $value | humanizePercentage }} full, above the 95% critical threshold."

  - name: exporter-health
    rules:
      # These two catch ONE failure mode: a collector that is registered and
      # running but cannot reach its device. That produces absent unas_*/protect_*
      # series rather than series reading zero, so no per-subject rule above can
      # see it — but the collector itself is still there to report success == 0.
      #
      # They do NOT catch a collector that never registered, nor one that
      # scrapes successfully and returns nothing useful. Those two are covered
      # by the absent() rules further down, which exist precisely because
      # success == 0 is not the only way this can be broken.
      - alert: UNASCollectorFailing
        expr: unas_scrape_collector_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UNAS metrics collection is failing"
          description: "The UNAS collector has failed every scrape for 15m; all unas_* series are stale or absent."

      - alert: ProtectCollectorFailing
        expr: protect_scrape_collector_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Protect metrics collection is failing"
          description: "The Protect collector has failed every scrape for 15m; all protect_* series are stale or absent."

      # This one catches a DIFFERENT failure mode from the two above: not a
      # collector that can't reach its device, but /metrics itself dropping
      # some series while still answering HTTP 200. This exporter serves
      # /metrics with promhttp.ContinueOnError specifically so one bad
      # collector (a duplicate series, a panic) can't blank the whole
      # endpoint — the trade is that the only signal for a partial gather
      # failure is this counter. It's a counter, so alert on increase() over
      # a window rather than the raw value: a raw `> 0` latches forever after
      # a single transient error.
      - alert: ExporterGatheringErrors
        expr: increase(promhttp_metric_handler_errors_total{cause="gathering"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Exporter is dropping series on /metrics"
          description: "promhttp_metric_handler_errors_total{cause=\"gathering\"} increased in the last 15m. /metrics is served with ContinueOnError, so this scrape returned HTTP 200 while silently missing series rather than failing outright — likely cause is a duplicate series or a panic in one collector."

  # absent() backstops. Everything above needs a series to evaluate; these are
  # the rules for when the series that would have alerted is simply not there.
  #
  # ADOPTERS: delete the pair for a collector you deliberately do not run. An
  # exporter configured with only --protect.url never emits unas_* at all, and
  # UNASCollectorAbsent would then fire forever.
  - name: exporter-absent
    rules:
      # A collector that never REGISTERED — a typo'd secret key, an env var
      # that was never mounted, --collector.unas=false left in a values file —
      # makes unas_scrape_collector_success absent rather than 0. UNASCollectorFailing
      # matches on `== 0` and therefore can never fire for it: the exporter is
      # up, the scrape target is green, and there is simply no UNAS data at all.
      - alert: UNASCollectorAbsent
        expr: absent(unas_scrape_collector_success)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "UNAS collector is not registered"
          description: "unas_scrape_collector_success has been absent for 15m: the UNAS collector is not running at all (check --unas.url / UNAS_API_KEY), rather than running and failing."

      - alert: ProtectCollectorAbsent
        expr: absent(protect_scrape_collector_success)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Protect collector is not registered"
          description: "protect_scrape_collector_success has been absent for 15m: the Protect collector is not running at all (check --protect.url / PROTECT_USERNAME / PROTECT_PASSWORD), rather than running and failing."

      # Series-level backstops for the nastiest case of all: a collector
      # reporting success == 1 while producing WRONG data. A UniFi firmware
      # update that renames a payload key (`disks` -> `drives`, say) still
      # decodes cleanly into zero-valued structs — err is nil, success is 1,
      # and every disk and pool series silently disappears. Nothing else in
      # this file notices, because every other rule needs those series to
      # evaluate at all.
      #
      # The `and on() ... == 1` is what separates this from the collector rules
      # above: it fires only while the collector claims to be healthy. A
      # genuinely failing or unregistered collector is already covered, and
      # would otherwise page twice for one fault.
      - alert: UNASDiskSeriesAbsent
        expr: absent(unas_disk_state) and on() unas_scrape_collector_success == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "UNAS reports a healthy scrape but no disks"
          description: "unas_disk_state has been absent for 15m while unas_scrape_collector_success reads 1. The collector is scraping successfully and returning no disks — most likely the device payload changed shape. Every disk alert is silently unable to fire until this is fixed."

      - alert: UNASPoolSeriesAbsent
        expr: absent(unas_pool_status) and on() unas_scrape_collector_success == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "UNAS reports a healthy scrape but no pools"
          description: "unas_pool_status has been absent for 15m while unas_scrape_collector_success reads 1. The collector is scraping successfully and returning no storage pools — most likely the device payload changed shape. Every pool alert is silently unable to fire until this is fixed."

      # Protect's own version of the two backstops above — this file shipped
      # the UNAS pair but no Protect equivalent, which is an asymmetry rather
      # than a deliberate choice: the reasoning isn't UNAS-specific. A UniFi
      # OS update that renames a key in /proxy/protect/api/bootstrap decodes
      # cleanly into a zero-valued struct the same way — err is nil, success
      # stays 1, and protect_camera_up / protect_sensor_up / protect_bridge_up
      # all vanish at once (they're populated by looping over decoded
      # slices; an empty slice from a renamed key just produces zero
      # samples, not an error).
      #
      # Anchored on protect_sensor_up rather than protect_camera_up:
      # protect_camera_up is still emitted (at 0) for a merely disconnected
      # camera, so its absence is a weaker canary for "the series itself
      # vanished" than an always-connected-in-practice sensor fleet.
      # protect_sensor_up also carries any leak/tamper/battery alerts a
      # downstream consumer builds on top of this file, making it the metric
      # most worth protecting.
      #
      # protect_nvr_info was considered as a second anchor, the way UNAS
      # gets two (disks and pools are independently reshapable). It does NOT
      # work the same way: protect_nvr_info is appended unconditionally
      # regardless of how the nested NVR fields decode (it is not gated by a
      # per-element loop the way protect_camera_up/protect_sensor_up/
      # protect_bridge_up are), so a reshape under the `nvr` key still
      # produces protect_nvr_info with empty/zero labels rather than an
      # absent series. Anchoring on it would add a rule that can
      # structurally never fire.
      #
      # Same `and on()` caveat as the UNAS pair: this only works because
      # protect_scrape_collector_success carries no labels.
      - alert: ProtectSensorSeriesAbsent
        expr: absent(protect_sensor_up) and on() protect_scrape_collector_success == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Protect reports a healthy scrape but no sensors"
          description: "protect_sensor_up has been absent for 15m while protect_scrape_collector_success reads 1. The collector is scraping successfully and returning no sensors — most likely the device payload changed shape. Any leak, tamper or battery alerting built on this series is silently unable to fire until this is fixed."
