rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # --- UNASDiskOverheating: for 30m, threshold 55 ---
  - interval: 1m
    input_series:
      - series: 'unas_disk_temperature_celsius{slot="1",serial="REDACTED1"}'
        values: '45+0x40'          # 45 °C throughout: normal idle temperature
    alert_rule_test:
      - eval_time: 35m
        alertname: UNASDiskOverheating
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_disk_temperature_celsius{slot="1",serial="REDACTED1"}'
        values: '62+0x40'          # above 55 for the whole window
    alert_rule_test:
      - eval_time: 20m             # still inside for: 30m — must NOT fire yet
        alertname: UNASDiskOverheating
        exp_alerts: []
      - eval_time: 35m
        alertname: UNASDiskOverheating
        exp_alerts:
          - exp_labels:
              severity: warning
              slot: "1"
              serial: REDACTED1
            exp_annotations:
              summary: "UNAS disk in slot 1 running hot"
              description: "Disk REDACTED1 in slot 1 has been above 55 °C for 30m."

  # --- UNASDiskNotOptimal: for 5m ---
  - interval: 1m
    input_series:
      - series: 'unas_disk_state{slot="1",serial="REDACTED1",state="optimal"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASDiskNotOptimal
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_disk_state{slot="1",serial="REDACTED1",state="degraded"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASDiskNotOptimal
        exp_alerts:
          - exp_labels:
              severity: critical
              slot: "1"
              serial: REDACTED1
              state: degraded
            exp_annotations:
              summary: "UNAS disk in slot 1 is not optimal"
              description: 'Disk REDACTED1 in slot 1 reports state "degraded" (expected "optimal").'

  # --- UNASDiskHealthDegraded: for 10m, threshold < 5 ---
  - interval: 1m
    input_series:
      - series: 'unas_disk_health_score{slot="1",serial="REDACTED1",model="EXAMPLE-16TB",type="HDD"}'
        values: '5+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: UNASDiskHealthDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_disk_health_score{slot="1",serial="REDACTED1",model="EXAMPLE-16TB",type="HDD"}'
        values: '4+0x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: UNASDiskHealthDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              slot: "1"
              serial: REDACTED1
              model: EXAMPLE-16TB
              type: HDD
            exp_annotations:
              summary: "UNAS disk in slot 1 health degraded"
              description: "Disk REDACTED1 in slot 1 reports health 4/5."

  # --- UNASDiskUncorrectableSectors: increase() over 24h, no for: ---
  # A flat counter must NOT fire. This is the case that matters: slot 6 on the
  # real device carries a pre-existing uncorrectable sector, and a naive
  # "> 0" on the raw counter would alert on it forever.
  - interval: 5m
    input_series:
      - series: 'unas_disk_uncorrectable_sector_count_total{slot="6",serial="REDACTED2"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskUncorrectableSectors
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'unas_disk_uncorrectable_sector_count_total{slot="6",serial="REDACTED2"}'
        values: '1+0x150 2+0x150'   # one new sector partway through the window
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskUncorrectableSectors
        exp_alerts:
          - exp_labels:
              severity: warning
              slot: "6"
              serial: REDACTED2
            exp_annotations:
              summary: "UNAS disk in slot 6 gained an uncorrectable sector"
              description: "Disk REDACTED2 in slot 6 reported new uncorrectable sectors in the last 24h."

  # --- UNASDiskBadSectors: same shape, different counter ---
  - interval: 5m
    input_series:
      - series: 'unas_disk_bad_sector_count_total{slot="1",serial="REDACTED1"}'
        values: '0+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskBadSectors
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'unas_disk_bad_sector_count_total{slot="1",serial="REDACTED1"}'
        values: '0+0x150 1+0x150'
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskBadSectors
        exp_alerts:
          - exp_labels:
              severity: warning
              slot: "1"
              serial: REDACTED1
            exp_annotations:
              summary: "UNAS disk in slot 1 gained a bad sector"
              description: "Disk REDACTED1 in slot 1 reported new bad sectors in the last 24h."

  # --- UNASDiskReadErrors: same shape as the sector counters above ---
  - interval: 5m
    input_series:
      - series: 'unas_disk_smart_read_error_count_total{slot="1",serial="REDACTED1"}'
        values: '1+0x300'
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskReadErrors
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'unas_disk_smart_read_error_count_total{slot="1",serial="REDACTED1"}'
        values: '1+0x150 2+0x150'   # one new read error partway through the window
    alert_rule_test:
      - eval_time: 24h
        alertname: UNASDiskReadErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              slot: "1"
              serial: REDACTED1
            exp_annotations:
              summary: "UNAS disk in slot 1 reported a new SMART read error"
              description: "Disk REDACTED1 in slot 1 reported new SMART read errors in the last 24h."

  # --- UNASPoolUnhealthy: for 5m. "scrubbing" is known-good and must not fire ---
  - interval: 1m
    input_series:
      - series: 'unas_pool_status{pool="pool-uuid-1",status="scrubbing"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASPoolUnhealthy
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_pool_status{pool="pool-uuid-1",status="degraded"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASPoolUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: pool-uuid-1
              status: degraded
            exp_annotations:
              summary: "UNAS pool pool-uuid-1 is not healthy"
              description: 'Pool pool-uuid-1 reports status "degraded", which is not a known-good state.'

  # --- UNASPoolProtectionDegraded: for 5m ---
  - interval: 1m
    input_series:
      - series: 'unas_pool_current_protection{pool="pool-uuid-1",raid_group="raid-group-1"}'
        values: '2+0x10'
      - series: 'unas_pool_expected_protection{pool="pool-uuid-1",raid_group="raid-group-1"}'
        values: '2+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASPoolProtectionDegraded
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_pool_current_protection{pool="pool-uuid-1",raid_group="raid-group-1"}'
        values: '1+0x10'
      - series: 'unas_pool_expected_protection{pool="pool-uuid-1",raid_group="raid-group-1"}'
        values: '2+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: UNASPoolProtectionDegraded
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: pool-uuid-1
              raid_group: raid-group-1
            exp_annotations:
              summary: "UNAS pool pool-uuid-1 has lost redundancy"
              description: "RAID group raid-group-1 can absorb 1 more disk failure(s), fewer than configured."

  # --- UNASPoolFillingUp / UNASPoolAlmostFull: 0.85 for 1h, 0.95 for 30m ---
  - interval: 5m
    input_series:
      - series: 'unas_pool_used_bytes{pool="pool-uuid-1"}'
        values: '800+0x20'
      - series: 'unas_pool_capacity_bytes{pool="pool-uuid-1"}'
        values: '1000+0x20'        # 80%: below both thresholds
    alert_rule_test:
      - eval_time: 90m
        alertname: UNASPoolFillingUp
        exp_alerts: []
      - eval_time: 90m
        alertname: UNASPoolAlmostFull
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'unas_pool_used_bytes{pool="pool-uuid-1"}'
        values: '900+0x20'
      - series: 'unas_pool_capacity_bytes{pool="pool-uuid-1"}'
        values: '1000+0x20'        # 90%: warning only, not critical
    alert_rule_test:
      - eval_time: 90m
        alertname: UNASPoolFillingUp
        exp_alerts:
          - exp_labels:
              severity: warning
              pool: pool-uuid-1
            exp_annotations:
              summary: "UNAS pool pool-uuid-1 is filling up"
              description: "Pool pool-uuid-1 is 90% full, above the 85% warning threshold."
      - eval_time: 90m
        alertname: UNASPoolAlmostFull
        exp_alerts: []

  - interval: 5m
    input_series:
      - series: 'unas_pool_used_bytes{pool="pool-uuid-1"}'
        values: '980+0x20'
      - series: 'unas_pool_capacity_bytes{pool="pool-uuid-1"}'
        values: '1000+0x20'        # 98%: above both thresholds, held past for: 30m
    alert_rule_test:
      - eval_time: 90m
        alertname: UNASPoolAlmostFull
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: pool-uuid-1
            exp_annotations:
              summary: "UNAS pool pool-uuid-1 is almost full"
              description: "Pool pool-uuid-1 is 98% full, above the 95% critical threshold."

  # --- Collector backstops: for 15m ---
  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: UNASCollectorFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: UNASCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "UNAS metrics collection is failing"
              description: "The UNAS collector has failed every scrape for 15m; all unas_* series are stale or absent."

  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ProtectCollectorFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ProtectCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Protect metrics collection is failing"
              description: "The Protect collector has failed every scrape for 15m; all protect_* series are stale or absent."

  # --- ExporterGatheringErrors: increase() over 15m, no for: ---
  # A flat counter must NOT fire. This is the case that matters: it proves
  # this isn't a latching `> 0` on the raw counter, which would alert forever
  # after a single transient gathering error.
  - interval: 1m
    input_series:
      - series: 'promhttp_metric_handler_errors_total{cause="gathering"}'
        values: '3+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ExporterGatheringErrors
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'promhttp_metric_handler_errors_total{cause="gathering"}'
        values: '3+0x10 4+0x10'    # one new gathering error partway through
    alert_rule_test:
      - eval_time: 18m
        alertname: ExporterGatheringErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              cause: gathering
            exp_annotations:
              summary: "Exporter is dropping series on /metrics"
              description: 'promhttp_metric_handler_errors_total{cause="gathering"} increased in the last 15m. /metrics is served with ContinueOnError, so this scrape returned HTTP 200 while silently missing series rather than failing outright — likely cause is a duplicate series or a panic in one collector.'

  # --- absent() backstops: for 15m ---
  # Each of these needs a "the series exists" side too, because an absent()
  # rule with no such case would pass just as happily against `expr: vector(1)`.

  # UNASCollectorAbsent: the collector is registered, so it must stay quiet
  # even while it is FAILING — that case belongs to UNASCollectorFailing.
  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: UNASCollectorAbsent
        exp_alerts: []

  # No unas_* series at all — the collector never registered. An unrelated
  # series is supplied so the test has a time range to evaluate over.
  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m             # inside for: 15m — must NOT fire yet
        alertname: UNASCollectorAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: UNASCollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "UNAS collector is not registered"
              description: "unas_scrape_collector_success has been absent for 15m: the UNAS collector is not running at all (check --unas.url / UNAS_API_KEY), rather than running and failing."
      # ... and the Protect collector, which IS present, must not alert.
      - eval_time: 18m
        alertname: ProtectCollectorAbsent
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProtectCollectorAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: ProtectCollectorAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Protect collector is not registered"
              description: "protect_scrape_collector_success has been absent for 15m: the Protect collector is not running at all (check --protect.url / PROTECT_USERNAME / PROTECT_PASSWORD), rather than running and failing."

  # UNASDiskSeriesAbsent / UNASPoolSeriesAbsent: healthy scrape, series present.
  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '1+0x20'
      - series: 'unas_disk_state{slot="1",serial="REDACTED1",state="optimal"}'
        values: '1+0x20'
      - series: 'unas_pool_status{pool="pool-uuid-1",status="healthy"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: UNASDiskSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: UNASPoolSeriesAbsent
        exp_alerts: []

  # The reshape: `disks`/`pools` renamed upstream, so both families decode to
  # nothing while the scrape still reports success. unas_info survives with
  # empty labels, which is exactly how this looks on a real payload change.
  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '1+0x20'
      - series: 'unas_info{device="",model="",firmware="",version=""}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m             # inside for: 15m
        alertname: UNASDiskSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: UNASDiskSeriesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "UNAS reports a healthy scrape but no disks"
              description: "unas_disk_state has been absent for 15m while unas_scrape_collector_success reads 1. The collector is scraping successfully and returning no disks — most likely the device payload changed shape. Every disk alert is silently unable to fire until this is fixed."
      - eval_time: 18m
        alertname: UNASPoolSeriesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "UNAS reports a healthy scrape but no pools"
              description: "unas_pool_status has been absent for 15m while unas_scrape_collector_success reads 1. The collector is scraping successfully and returning no storage pools — most likely the device payload changed shape. Every pool alert is silently unable to fire until this is fixed."

  # And the guard that keeps these two from double-paging: the same missing
  # series while the collector is FAILING is UNASCollectorFailing's business,
  # not theirs.
  - interval: 1m
    input_series:
      - series: 'unas_scrape_collector_success'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: UNASDiskSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: UNASPoolSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: UNASCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "UNAS metrics collection is failing"
              description: "The UNAS collector has failed every scrape for 15m; all unas_* series are stale or absent."

  # --- ProtectSensorSeriesAbsent: healthy scrape, sensor series present ---
  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '1+0x20'
      - series: 'protect_sensor_up{sensor="Protect Sensor",type="UFP-SENSE",mount_type="leak"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ProtectSensorSeriesAbsent
        exp_alerts: []

  # The reshape: `sensors` renamed upstream, so protect_sensor_up decodes to
  # nothing while the scrape still reports success. protect_nvr_info
  # survives with (near-)empty labels, which is exactly how this looks on a
  # real payload change — it is emitted unconditionally, not gated by a
  # per-element loop the way protect_sensor_up is. This is also why
  # protect_nvr_info itself was rejected as a second absence anchor: it
  # cannot go absent from this failure mode.
  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '1+0x20'
      - series: 'protect_nvr_info{device="",version="",firmware_version="",market_name="",release_channel=""}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 10m             # inside for: 15m
        alertname: ProtectSensorSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: ProtectSensorSeriesAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Protect reports a healthy scrape but no sensors"
              description: "protect_sensor_up has been absent for 15m while protect_scrape_collector_success reads 1. The collector is scraping successfully and returning no sensors — most likely the device payload changed shape. Any leak, tamper or battery alerting built on this series is silently unable to fire until this is fixed."

  # And the guard that keeps this from double-paging: the same missing
  # series while the collector is FAILING is ProtectCollectorFailing's
  # business, not ProtectSensorSeriesAbsent's.
  - interval: 1m
    input_series:
      - series: 'protect_scrape_collector_success'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: ProtectSensorSeriesAbsent
        exp_alerts: []
      - eval_time: 18m
        alertname: ProtectCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Protect metrics collection is failing"
              description: "The Protect collector has failed every scrape for 15m; all protect_* series are stale or absent."

  # --- UNASRemoteBackupNeedsReauth: for 15m ---
  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_needs_reauth{task="Example to Cloud",task_id="t1"}'
        values: '0+0x30'           # credential healthy throughout
    alert_rule_test:
      - eval_time: 25m
        alertname: UNASRemoteBackupNeedsReauth
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_needs_reauth{task="Example to Cloud",task_id="t1"}'
        values: '1+0x30'           # grant expired
    alert_rule_test:
      - eval_time: 10m             # inside for: 15m - must NOT fire yet
        alertname: UNASRemoteBackupNeedsReauth
        exp_alerts: []
      - eval_time: 20m
        alertname: UNASRemoteBackupNeedsReauth
        exp_alerts:
          - exp_labels:
              severity: warning
              task: Example to Cloud
              task_id: t1
            exp_annotations:
              summary: "UNAS remote backup Example to Cloud needs re-authorisation"
              description: "Task Example to Cloud has lost its remote credential. It is still scheduled and still enabled, but nothing is reaching the destination."

  # --- UNASRemoteBackupFailed: keyed on the error COUNT, not the status ---
  # A clean run is 0 error codes; the status label rides along for reading.
  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_last_run_error_count{task="Example to Cloud",task_id="t1"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: UNASRemoteBackupFailed
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_last_run_error_count{task="Example to Cloud",task_id="t1"}'
        values: '2+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: UNASRemoteBackupFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: UNASRemoteBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              task: Example to Cloud
              task_id: t1
            exp_annotations:
              summary: "UNAS remote backup Example to Cloud last run reported errors"
              description: 'Task Example to Cloud finished with 2 error code(s); its last status was "".'

  # --- UNASRemoteBackupCollectorFailing: the guard that keeps the rest honest ---
  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_scrape_collector_success'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: UNASRemoteBackupCollectorFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'unas_remote_backup_scrape_collector_success'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: UNASRemoteBackupCollectorFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: UNASRemoteBackupCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "UNAS remote-backup collector is failing"
              description: "The remote-backup collector cannot read the device. Every other unas_remote_backup alert is blind while this is firing - check the local account's credentials first, since that collector uses a cookie session rather than the API key."

  # --- UNASRemoteBackupStale: for 15m, threshold 27h ---
  # promtool's clock starts at epoch 0, so a last-run timestamp of 0 means the
  # age at eval_time T is exactly T. That is what makes a 27h threshold
  # testable at all without fabricating wall-clock times.
  #
  # interval MUST stay under Prometheus' 5m lookback delta. At 15m the series
  # is stale at almost every eval time, the expression matches nothing, and the
  # test fails while the ALERT is perfectly correct - a confusing way to lose
  # an hour. 4m x 450 covers 30h with a sample always in lookback range.
  - interval: 4m
    input_series:
      - series: 'unas_remote_backup_last_run_timestamp_seconds{task="Example to Cloud",task_id="t1"}'
        values: '0+0x450'
    alert_rule_test:
      - eval_time: 26h             # 93600s < 97200s - not stale yet
        alertname: UNASRemoteBackupStale
        exp_alerts: []
      - eval_time: 28h             # 100800s > 97200s, and past for: 15m
        alertname: UNASRemoteBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              task: Example to Cloud
              task_id: t1
            exp_annotations:
              summary: "UNAS remote backup Example to Cloud has not run in over 27 hours"
